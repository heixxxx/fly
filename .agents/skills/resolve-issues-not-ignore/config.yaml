[tool.skill.metadata]
name = "resolve-issues-not-ignore"
description = "遇到错误/问题时，不可直接放弃选择忽略问题的方式去进行fix/workaround，而是尝试解决问题；若问题与当前实现/架构/设计存在冲突，询问用户该如何处理"
category = "development"
version = "1.0.0"

[tool.skill.behavior]
rigid = true  # 严格执行，不允许绕过

[tool.skill.triggers]
on_error = true
on_compilation_failure = true
on_type_error = true
on_runtime_error = true
on_design_conflict = true
on_architecture_mismatch = true

[tool.skill.constraints]
no_ignore_errors = true
no_ts_ignore = true
no_as_any = true
no_empty_catch = true
no_test_deletion = true
no_workaround_first = true

[tool.skill.workflow]
step_1 = "detect_issue"
step_2 = "analyze_root_cause"
step_3 = "propose_solutions"
step_4 = "handle_conflict_by_consulting"
step_5 = "implement_fix"
step_6 = "verify_solution"

[tool.skill.responses]
issue_detected = "🔍 检测到问题：{issue_description}"
analysis_complete = "📋 根本原因分析完成：{root_cause}"
solution_proposed = "💡 解决方案：{solution_description}"
conflict_detected = "⚠️ 发现架构/设计冲突：{conflict_description}"
consultation_needed = "🤔 需要您的决策：{question}"
fix_implemented = "✅ 修复实施完成：{fix_summary}"
verification_passed = "🎯 验证通过：{verification_result}"

[tool.skill.forbidden_practices]
ts_ignore = "禁止使用 @ts-ignore 绕过类型检查"
as_any = "禁止使用 as any 绕过类型检查"
empty_catch = "禁止使用空的 catch 块"
test_deletion = "禁止删除测试来'通过'构建"
workaround_first = "禁止优先使用 workaround 而非根本修复"
shotgun_debugging = "禁止随机尝试修复而不分析根本原因"

[tool.skill.consultation_template]
conflict_description = "{conflict_type}: {specific_conflict}"
options = [
    "选项1: {option1_description} ({option1_pros}/{option1_cons})",
    "选项2: {option2_description} ({option2_pros}/{option2_cons})",
    "选项3: {option3_description} ({option3_pros}/{option3_cons})"
]
recommendation = "基于分析，建议：{recommended_option}"
user_question = "请选择处理方案或提供其他建议："
