<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fly cluster monitor</title>
<script>
// FOUC 防护：CSS 渲染前先按持久化偏好落 data-theme 与 lang（主题默认
// 跟随系统，语言默认中文；localStorage 在隐私模式下可能抛异常，吞掉
// 保持默认深色/中文即可——theme.js/i18n.js 加载后幂等重设）。
try {
  var _tm = localStorage.getItem('fly-monitor-theme') || 'system';
  var _dark = _tm === 'dark' ||
    (_tm === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = _dark ? 'dark' : 'light';
  document.documentElement.lang =
    (localStorage.getItem('fly-monitor-lang') || 'zh') === 'en' ? 'en' : 'zh-CN';
} catch (e) {}
</script>
<link rel="stylesheet" href="/static/css/app.css">
<script src="/static/vendor/echarts.min.js"></script>
</head>
<body>
<header>
  <div class="brand"><span class="brand-logo"></span>fly <span>cluster monitor</span></div>
  <nav id="nav">
    <button data-page="overview" class="active">总览</button>
    <button data-page="workers">Workers</button>
    <button data-page="tasks">Tasks</button>
    <button data-page="timeline">Timeline</button>
    <button data-page="dbs">DBs</button>
  </nav>
  <div class="header-right">
    <span id="run-info" class="run-info"></span>
    <span id="poll-state" class="poll-state"></span>
    <label class="poll-toggle">
      <input type="checkbox" id="poll-enabled" checked>
      <span class="switch"></span>
      <span id="poll-label">自动刷新</span>
    </label>
    <select id="lang-sel" class="hdr-select"></select>
    <select id="theme-sel" class="hdr-select"></select>
  </div>
</header>

<main id="main"></main>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
